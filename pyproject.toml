[project]
name = "vyshkat"
version = "0.1.0"
description = "Учёт парка кикшеринга «ВышКат»: ДЗ №1 по КПО"
readme = "README.md"
authors = [
    { name = "Karen Avanyan", email = "IProgrammist.1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "punq>=0.9.0",
]

[project.scripts]
vyshkat = "vyshkat.cli.main:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
# Общие тестовые двойники импортируются как `from fakes import ...`.
pythonpath = ["tests"]

[tool.coverage.run]
source = ["vyshkat"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 60
